[package]
name = "iou-fm"
version = "0.1.0"
description = "iou.fm – IBAN · Order · Überweisung"
authors = ["fork and merge UG"]
edition = "2021"

# Bibliotheks-Crate (von main.rs aufgerufen; Name für mobile/Desktop einheitlich).
[lib]
name = "iou_fm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auto-Update nur auf Desktop.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
